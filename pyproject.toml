[project]
name = "mostek-kultura"
version = "0.1.0"
description = "Denní přehled kulturních akcí v okolí obce Mostek"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "anthropic>=1.5",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
mostek-kultura = "mostek_kultura.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mostek_kultura*"]

[tool.setuptools.package-data]
mostek_kultura = ["templates/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
